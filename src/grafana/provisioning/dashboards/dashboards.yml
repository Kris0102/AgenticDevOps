# Tells Grafana to load every dashboard JSON under /var/lib/grafana/dashboards
# (baked in by the Dockerfile) at boot and hot-reload edits every 10s.
apiVersion: 1

providers:
  - name: AgenticDevOps
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
