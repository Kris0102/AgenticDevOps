services:
  postgres:
    # pgvector/pgvector is a drop-in superset of the official postgres image that
    # ships the `vector` extension — required by the Context Engine (code_chunks).
    # Pinned to pg15 to stay compatible with the existing postgres_data volume
    # (a pg16 image refuses to start on a pg15 data directory).
    image: pgvector/pgvector:pg15
    # Creds (POSTGRES_USER/PASSWORD/DB) come from the project .env — the SAME file
    # db.py and Alembic read, so all three agree. `env_file` is resolved RELATIVE
    # TO THIS COMPOSE FILE (like build.context), NOT the caller's cwd — so it works
    # from any directory and on any OS, no --env-file flag needed. The postgres
    # image loud-fails if POSTGRES_PASSWORD is unset. Run: `cp .env.example .env`,
    # fill it, then `docker compose -f deploy/docker-compose.yml up -d`.
    # WARNING: Postgres only applies these on FIRST init of an empty data dir.
    # Changed creds after the volume exists? Recreate it (wipes DB data):
    #   docker compose -f deploy/docker-compose.yml down -v && up -d
    env_file:
      - ../.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


#add pgadmin service
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-password}
    ports:
      - "8080:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
  # This service definition is used strictly to BUILD the base sandbox image.
  # The orchestrator's Docker SDK will spin up the actual containers.
  # We use a profile so that `docker-compose up` does not run a container for this.
  sandbox-image-builder:
    image: agentic-sandbox:0.1
    build:
      context: ../src/sandbox
      dockerfile: Dockerfile
    profiles:
      - donotstart
volumes:
    postgres_data:
    pgadmin_data: