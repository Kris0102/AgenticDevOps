services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-agentic_devops}
    ports:
      - "5432:5432"

  sandbox:
    image: agentic-sandbox:0.1
    build:
      context: ../src/sandbox
      dockerfile: Dockerfile
    container_name: agentic-sandbox
    working_dir: /workspace
    stdin_open: true
    tty: true
