# Tells Grafana to load every dashboard JSON under /etc/grafana/dashboards
# (baked in by the Dockerfile) at boot and hot-reload edits every 10s. NOTE: this path is
# deliberately OUTSIDE /var/lib/grafana — that dir is a named volume (grafana_data) that would
# mask the baked-in files, so a rebuild could never update them.
apiVersion: 1

providers:
  - name: AgenticDevOps
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
